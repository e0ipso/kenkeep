name: Pull Request Validation

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'

jobs:
  test-and-lint:
    name: Test and Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # The build above is the only one: --ignore-scripts skips the `pretest`
      # rebuild that local `npm test` keeps for contributors.
      - name: Run tests
        run: npm test --ignore-scripts

      - name: Typecheck production sources
        run: npm run typecheck

      - name: Typecheck tests and scripts
        run: npm run typecheck:tests

      - name: Run linting
        run: npm run lint
