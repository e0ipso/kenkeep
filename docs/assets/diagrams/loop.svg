<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-labelledby="t d">
  <title id="t">The kenkeep loop</title>
  <desc id="d">Four stages in a loop: capture (automatic), curate (you run /kk-curate), review (git diff, git commit), recall (automatic). A dot travels through the stages and back to capture for the next session.</desc>
  <style>
    .h { font-family: Outfit, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 17px; fill: #19110a; letter-spacing: 0.04em; }
    .t { font-family: Outfit, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 24px; fill: #19110a; letter-spacing: 0.06em; }
    .b { font-family: Outfit, 'Helvetica Neue', Arial, sans-serif; font-size: 13px; fill: #463c30; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; fill: #19110a; }
    .pill { font-family: Outfit, 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 0.12em; }
    .wm { font-family: Outfit, 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #19110a; letter-spacing: -0.02em; }
    .panel { fill: #f1e8d6; stroke: #d8c7a4; stroke-width: 2; }
    .ico { fill: none; stroke: #2c2318; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .arrow { fill: none; stroke: #2c2318; stroke-width: 2.5; }
    .ret { fill: none; stroke: #2c2318; stroke-width: 2.5; stroke-dasharray: 2 7; stroke-linecap: round; }
    .p1 { animation: glow 8s linear infinite; animation-delay: 0s; }
    .p2 { animation: glow 8s linear infinite; animation-delay: 1.1s; }
    .p3 { animation: glow 8s linear infinite; animation-delay: 2.2s; }
    .p4 { animation: glow 8s linear infinite; animation-delay: 3.3s; }
    @keyframes glow {
      0%, 12% { stroke: #ad2e6a; fill: #f7e3ec; }
      16%, 100% { stroke: #d8c7a4; fill: #f1e8d6; }
    }
    @media (prefers-reduced-motion: reduce) {
      .p1, .p2, .p3, .p4 { animation: none; }
      .dot { display: none; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2c2318"/>
    </marker>
  </defs>
  <rect width="1000" height="440" rx="18" fill="#f8f4ec"/>
  <text class="t" x="500" y="46" text-anchor="middle">THE KENKEEP LOOP</text>

  <!-- return path: recall back to capture for the next session -->
  <path class="ret" d="M860,120 V88 H140 V112" marker-end="url(#ah)"/>
  <rect x="425" y="74" width="150" height="26" rx="13" fill="#f8f4ec"/>
  <text class="b" x="500" y="92" text-anchor="middle">next session</text>

  <!-- panels -->
  <g>
    <rect class="panel p1" x="40" y="120" width="200" height="220" rx="14"/>
    <text class="h" x="60" y="152">1. CAPTURE</text>
    <rect x="60" y="164" width="92" height="20" rx="10" fill="#c9a06a"/>
    <text class="pill" x="106" y="178" text-anchor="middle" fill="#19110a">AUTOMATIC</text>
    <g class="ico" transform="translate(60,200)">
      <path d="M8,2 h34 l14,14 v48 h-48 z"/>
      <path d="M42,2 v14 h14"/>
      <path d="M18,32 h28 M18,44 h28 M18,56 h18"/>
      <path d="M84,10 h40 a8,8 0 0 1 8,8 v22 a8,8 0 0 1 -8,8 h-22 l-14,12 v-12 h-4 a8,8 0 0 1 -8,-8 v-22 a8,8 0 0 1 8,-8 z"/>
    </g>
    <text class="b" x="60" y="300">A hook saves the transcript</text>
    <text class="b" x="60" y="320">at session end.</text>
  </g>

  <g>
    <rect class="panel p2" x="280" y="120" width="200" height="220" rx="14"/>
    <text class="h" x="300" y="152">2. CURATE</text>
    <rect x="300" y="164" width="52" height="20" rx="10" fill="#ad2e6a"/>
    <text class="pill" x="326" y="178" text-anchor="middle" fill="#f8f4ec">YOU</text>
    <g class="ico" transform="translate(300,200)">
      <circle cx="46" cy="30" r="22"/>
      <path d="M62,46 l22,22"/>
      <path d="M36,30 h20 M46,20 v20"/>
      <path d="M96,8 h34 v20 h-34 z M96,40 h34 v20 h-34 z"/>
    </g>
    <text class="m" x="300" y="300">/kk-curate</text>
    <text class="b" x="300" y="320">drafts one note per fact.</text>
  </g>

  <g>
    <rect class="panel p3" x="520" y="120" width="200" height="220" rx="14"/>
    <text class="h" x="540" y="152">3. REVIEW</text>
    <rect x="540" y="164" width="52" height="20" rx="10" fill="#ad2e6a"/>
    <text class="pill" x="566" y="178" text-anchor="middle" fill="#f8f4ec">YOU</text>
    <g class="ico" transform="translate(540,200)">
      <rect x="4" y="4" width="130" height="62" rx="8"/>
      <path d="M22,26 h10 M27,21 v10" stroke="#3f7a3a"/>
      <path d="M44,26 h70" stroke="#3f7a3a"/>
      <path d="M22,48 h10" stroke="#ad2e6a"/>
      <path d="M44,48 h52" stroke="#ad2e6a"/>
    </g>
    <text class="m" x="540" y="300">git diff · git commit</text>
    <text class="b" x="540" y="320">Keep what is right.</text>
  </g>

  <g>
    <rect class="panel p4" x="760" y="120" width="200" height="220" rx="14"/>
    <text class="h" x="780" y="152">4. RECALL</text>
    <rect x="780" y="164" width="92" height="20" rx="10" fill="#c9a06a"/>
    <text class="pill" x="826" y="178" text-anchor="middle" fill="#19110a">AUTOMATIC</text>
    <g class="ico" transform="translate(780,200)">
      <rect x="44" y="2" width="50" height="24" rx="5"/>
      <path d="M69,26 v12 M30,38 h78 M30,38 v8 M108,38 v8"/>
      <rect x="6" y="46" width="48" height="22" rx="5"/>
      <rect x="84" y="46" width="48" height="22" rx="5"/>
    </g>
    <text class="b" x="780" y="300">The catalog is injected</text>
    <text class="b" x="780" y="320">into every new session.</text>
  </g>

  <!-- forward arrows -->
  <path class="arrow" d="M240,230 H276" marker-end="url(#ah)"/>
  <path class="arrow" d="M480,230 H516" marker-end="url(#ah)"/>
  <path class="arrow" d="M720,230 H756" marker-end="url(#ah)"/>

  <!-- travelling dot -->
  <circle class="dot" r="7" fill="#ad2e6a" stroke="#f8f4ec" stroke-width="2">
    <animateMotion dur="8s" repeatCount="indefinite" path="M140,230 H380 H620 H860 V88 H140 V230"/>
  </circle>

  <text class="wm" x="500" y="412" text-anchor="middle">kenkeep</text>
</svg>
