fixture_id: admit-map-vocab-01
category: admit-map-vocab
expect_empty: false
expected_points:
  - id: quiet-revision-vocabulary
    preferred_type: map
    claim: A quiet revision updates search and syndication metadata without reopening Beacon Review Lane.
    required_facets:
      - id: metadata-scope
        criterion: A quiet revision updates search and syndication metadata.
      - id: skips-review
        criterion: It does not reopen or enter Beacon Review Lane.
      - id: still-a-revision
        criterion: Quiet describes workflow impact, not storage, and a revision is still created.
  - id: quiet-revision-rendered-fields
    preferred_type: practice
    claim: Quiet revisions cannot change rendered body fields.
    required_facets:
      - id: prohibit-rendered-fields
        criterion: Validation rejects rendered-body changes in quiet revisions.
      - id: nested-components
        criterion: The prohibition includes nested rendered component fields, not only the top-level body field.
  - id: quiet-revision-public-phrase
    preferred_type: practice
    claim: Public API descriptions use the exact project phrase quiet revision.
    required_facets:
      - id: exact-public-term
        criterion: Public API text uses the exact phrase quiet revision.
      - id: project-meaning
        criterion: The phrase carries the project's workflow meaning rather than a generic editorial interpretation.
max_unexpected_proposals: 0
notes: >-
  Expects the term's definition, its validation invariant, and its exact public API naming rule as atomic concepts.
